services:
  - type: web
    name: receivia
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # SPA: every path serves index.html so client-side routes (/pay/:token, /invoices) deep-link.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      # The service worker must always be revalidated so a new deploy reaches installed apps.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
    envVars:
      - fromGroup: receivia-groupname
      - key: NODE_VERSION
        value: 22

  # Daily collections agent (Render Workflows). Needs the env vars below; see STATE.md > Needs owner.
  - type: workflow
    name: receivia-agent
    runtime: node
    region: singapore
    buildCommand: cd automation/render && npm ci
    startCommand: cd automation/render && node index.mjs
    envVars:
      - key: SUPABASE_FUNCTIONS_URL
        value: https://nxohumijpbwfxomvkckk.supabase.co/functions/v1
      - key: AGENT_CRON_SECRET
        sync: false

  # 10:00 IST every day (04:30 UTC): starts the workflow's `daily` task through the Render API.
  - type: cron
    name: receivia-agent-daily
    runtime: node
    region: singapore
    schedule: '30 4 * * *'
    buildCommand: cd automation/render && npm ci
    startCommand: cd automation/render && node trigger.mjs
    envVars:
      - key: RENDER_API_KEY
        sync: false
      - key: WORKFLOW_SLUG
        value: receivia-agent
