services:
  - type: web
    name: receivia
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # SPA: every path serves index.html so client-side routes (/pay/:token, /invoices) deep-link.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: NODE_VERSION
        value: 22
